# Netlify site for the CMS (base directory: apps/cms). Netlify installs from
# the repo root (pnpm workspace) and builds this app with its Next.js runtime.
[build]
  # Migrations run against the production database before every build, so
  # schema changes ship with the code that needs them.
  command = "pnpm migrate && pnpm build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "24"

# Sites created through the API skip framework detection, so the Next.js
# runtime has to be declared; without it the deploy is static files only.
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Deploy previews share the production database, so they build without
# migrating; only main (production) applies migrations.
[context.deploy-preview]
  command = "pnpm build"

[context.branch-deploy]
  command = "pnpm build"
