# Netlify site for the API (base directory: apps/api).
[build]
  # Production applies pending migrations to Turso before deploying.
  command = "pnpm db:migrate && pnpm typecheck"
  publish = "public"

[build.environment]
  NODE_VERSION = "24"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Previews share the production database, so they never migrate it.
[context.deploy-preview]
  command = "pnpm typecheck"

[context.branch-deploy]
  command = "pnpm typecheck"
